services:
  - type: web
    name: fitcore-backend
    runtime: node
    plan: free
    rootDir: fitcore/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    healthCheckPath: /api/health
    disks:
      - name: fitcore-db
        mountPath: /data
        sizeGB: 1
