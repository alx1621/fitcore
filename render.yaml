services:
  - type: web
    name: fitcore-backend
    runtime: node
    plan: free
    rootDir: fitcore/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LIBSQL_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
    healthCheckPath: /api/health
    initialDeployHook: node db/seed.js
